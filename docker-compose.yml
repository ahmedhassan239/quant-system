services:
  postgres_db:
    image: postgres:15-alpine
    container_name: quant_postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: quant_shared_db
    command: >
      sh -c "docker-entrypoint.sh postgres &
      until pg_isready -U ${POSTGRES_USER}; do sleep 1; done;
      psql -U ${POSTGRES_USER} -tc \"SELECT 1 FROM pg_database WHERE datname = 'macro_1h_db'\" | grep -q 1 || psql -U ${POSTGRES_USER} -c 'CREATE DATABASE macro_1h_db;';
      psql -U ${POSTGRES_USER} -tc \"SELECT 1 FROM pg_database WHERE datname = 'exec_15m_db'\" | grep -q 1 || psql -U ${POSTGRES_USER} -c 'CREATE DATABASE exec_15m_db;';
      wait"
    volumes:
      - ./data-volumes/postgres_data:/var/lib/postgresql/data
    networks:
      - quant_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis_cache:
    image: redis:7-alpine
    container_name: quant_redis
    restart: unless-stopped
    volumes:
      - ./data-volumes/redis_data:/data
    networks:
      - quant_network

  quant_macro_engine:
    build: { context: ./backend-python, dockerfile: Dockerfile }
    container_name: quant_macro_engine
    restart: unless-stopped
    environment:
      - ENGINE_ROLE=MACRO
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - ./backend-python:/app
    depends_on:
      postgres_db: { condition: service_healthy }
      redis_cache: { condition: service_started }
    networks:
      - quant_network

  quant_exec_engine:
    build: { context: ./backend-python, dockerfile: Dockerfile }
    container_name: quant_exec_engine
    restart: unless-stopped
    environment:
      - ENGINE_ROLE=EXEC
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - ./backend-python:/app
    depends_on:
      postgres_db: { condition: service_healthy }
      redis_cache: { condition: service_started }
    networks:
      - quant_network

  laravel_api:
    build: { context: ./api-laravel, dockerfile: Dockerfile }
    container_name: quant_laravel_api
    restart: unless-stopped
    command: php -S 0.0.0.0:8000 -t public
    ports:
      - "8080:8000"
    volumes:
      - ./api-laravel:/app
    depends_on:
      - postgres_db
    networks:
      - quant_network

  vue_dashboard:
    build: { context: ./frontend-vue, dockerfile: Dockerfile }
    container_name: quant_vue_dashboard
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0 --port 5173
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    ports:
      - "5173:5173"
    volumes:
      - ./frontend-vue:/app
    networks:
      - quant_network

networks:
  quant_network:
    driver: bridge