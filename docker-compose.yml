services:
  # 1. طبقة قاعدة البيانات (PostgreSQL)
  postgres_db:
    image: postgres:15-alpine
    container_name: quant_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: quant_db
      POSTGRES_USER: quant_user
      POSTGRES_PASSWORD: secret123
    # Also create the testnet database on first boot
    command: >
      bash -c "docker-entrypoint.sh postgres &
      until pg_isready -U quant_user; do sleep 1; done;
      psql -U quant_user -tc \"SELECT 1 FROM pg_database WHERE datname = 'testnet_quant_db'\" | grep -q 1 || psql -U quant_user -c 'CREATE DATABASE testnet_quant_db;';
      wait"
    volumes:
      - ./data-volumes/postgres_data:/var/lib/postgresql/data
    networks:
      - quant_network
    # تم إزالة البورتات نهائياً لحماية الداتا بيز من أي وصول خارجي

    # 2. طبقة الذاكرة السريعة (Redis) للأسعار اللحظية
  redis_cache:
    image: redis:7-alpine
    container_name: quant_redis
    restart: unless-stopped
    volumes:
      - ./data-volumes/redis_data:/data
    networks:
      - quant_network
    # تم إزالة البورتات نهائياً للأمان

    # 3a. 🚀 Live Quant Engine (15m timeframe, production API)
  quant_live_engine:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    container_name: quant_live_engine
    restart: unless-stopped
    environment:
      ENV_TYPE: LIVE
      BINANCE_BASE_URL: "https://api.binance.com/api"
      TIMEFRAME: "15m"
      DB_NAME: quant_db
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    volumes:
      - ./backend-python:/app
    depends_on:
      - postgres_db
      - redis_cache
    networks:
      - quant_network

  # 3b. 🧪 Testnet Quant Engine (5m timeframe, testnet API)
  quant_testnet_engine:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    container_name: quant_testnet_engine
    restart: unless-stopped
    environment:
      ENV_TYPE: TESTNET
      BINANCE_BASE_URL: "https://testnet.binance.vision/api"
      TIMEFRAME: "5m"
      DB_NAME: testnet_quant_db
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      BINANCE_TESTNET_API_KEY: ${BINANCE_TESTNET_API_KEY}
      BINANCE_TESTNET_SECRET_KEY: ${BINANCE_TESTNET_SECRET_KEY}
    volumes:
      - ./backend-python:/app
    depends_on:
      - postgres_db
      - redis_cache
    networks:
      - quant_network

  # 4. الواجهة الخلفية للوحة التحكم (Laravel API)
  laravel_api:
    build:
      context: ./api-laravel
      dockerfile: Dockerfile
    container_name: quant_laravel_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000" # مغلق على السيرفر الداخلي فقط
    volumes:
      - ./api-laravel:/app
    depends_on:
      - postgres_db
    networks:
      - quant_network

  # 5. لوحة التحكم التفاعلية (Vue.js Frontend)
  vue_dashboard:
    build:
      context: ./frontend-vue
      dockerfile: Dockerfile
    container_name: quant_vue_dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173" # مغلق على السيرفر الداخلي فقط
    volumes:
      - ./frontend-vue:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - laravel_api
    networks:
      - quant_network

  # 6. واجهة إدارة قواعد البيانات (pgAdmin)
  pgadmin:
    image: dpage/pgadmin4
    container_name: quant_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@quant.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "127.0.0.1:5050:80" # مغلق على السيرفر الداخلي فقط
    volumes:
      - ./data-volumes/pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres_db
    networks:
      - quant_network

  # 7. لوحة تحكم البيانات (Metabase) - تمت إضافتها لمتابعة الأرباح
  metabase:
    image: metabase/metabase:latest
    container_name: quant_metabase
    restart: unless-stopped
    ports:
      - "3000:3000" # مغلق على السيرفر الداخلي فقط
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: quant_db
      MB_DB_PORT: 5432
      MB_DB_USER: quant_user
      MB_DB_PASS: secret123
      MB_DB_HOST: postgres_db
    depends_on:
      - postgres_db
    networks:
      - quant_network

networks:
  quant_network:
    driver: bridge
